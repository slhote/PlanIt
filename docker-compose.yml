services:
  postgres:
    # pgvector/pgvector:pg16 = stock postgres:16 + the pgvector extension pre-installed, needed
    # for the Similar Tasks semantic-embeddings tables (planit-similar-tasks-semantic-embeddings.md).
    image: pgvector/pgvector:pg16
    container_name: planit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: PlanIt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - planit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d PlanIt"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: PlanIt.Api/Dockerfile
    container_name: planit-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=PlanIt;Username=postgres;Password=postgres"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Jwt__Issuer: "planit-api-dev"
      Jwt__Audience: "planit-web-dev"
      Jwt__ExpirationMinutes: "15"
      Jwt__RefreshTokenExpirationDays: "30"
      # JWT signing key — required. Set via .env or export JWT_SIGNING_KEY=... before running.
      Jwt__SigningKey: "${JWT_SIGNING_KEY}"
      APPLY_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full-stack

volumes:
  planit-postgres-data:
