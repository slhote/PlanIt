name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "PlanIt.Api/**"
      - "PlanIt.Api.Tests/**"
      - "PlanIt.slnx"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "PlanIt.Api/**"
      - "PlanIt.Api.Tests/**"
      - "PlanIt.slnx"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PlanIt.slnx

      - name: Build
        run: dotnet build PlanIt.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PlanIt.slnx --no-build --configuration Release
