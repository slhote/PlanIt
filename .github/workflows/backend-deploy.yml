name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - "PlanIt.Api/**"
      - "PlanIt.Api.Tests/**"
      - "PlanIt.slnx"
      - "Dockerfile"
      - ".github/workflows/backend-deploy.yml"

permissions:
  contents: read
  packages: write      # push to GHCR
  id-token: write      # OIDC token for Azure login

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PlanIt.slnx

      - name: Build
        run: dotnet build PlanIt.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PlanIt.slnx --no-build --configuration Release

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: PlanIt.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/slhote/planit-api:${{ github.sha }}
            ghcr.io/slhote/planit-api:latest

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision infrastructure and deploy
        run: |
          az deployment group create \
            --resource-group planit-rg \
            --template-file infra/main.bicep \
            --parameters \
              containerImage=ghcr.io/slhote/planit-api:${{ github.sha }} \
              neonConnectionString="${{ secrets.NEON_CONNECTION_STRING }}" \
              jwtSigningKey="${{ secrets.JWT_SIGNING_KEY }}"
